<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>MallNav — Bencoolen Mall</title>
<meta name="description" content="Navigasi indoor Bencoolen Mall. Cari tujuan, lihat rute, dan sampai dalam hitungan detik." />
<meta name="theme-color" content="#2952e3" id="metaThemeColor" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MallNav" />
<meta name="format-detection" content="telephone=no" />

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/navigation.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body>

<!-- ============================== SPLASH ============================== -->
<div id="splash">
  <div class="splash-mark">
    <svg viewBox="0 0 24 24" width="44" height="44"><path d="M12 2C7.6 2 4 5.4 4 9.6 4 15 12 22 12 22s8-7 8-12.4C20 5.4 16.4 2 12 2Zm0 10.2a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z" fill="#fff"/></svg>
  </div>
  <div class="splash-title">MallNav</div>
  <div class="splash-sub">POWERED FOR BENCOOLEN MALL</div>
</div>

<div id="app">

  <!-- ============================== HOME ============================== -->
  <section id="screen-home" class="screen">
    <header class="home-header">
      <div class="home-header__mark">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2C7.6 2 4 5.4 4 9.6 4 15 12 22 12 22s8-7 8-12.4C20 5.4 16.4 2 12 2Zm0 10.2a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z" fill="#fff"/></svg>
      </div>
      <div class="home-header__text">
        <div class="home-header__title">MallNav</div>
        <div class="home-header__subtitle">Powered for Bencoolen Mall</div>
      </div>
      <div class="home-header__spacer"></div>
      <button class="icon-btn theme-toggle" id="btnTheme" aria-label="Ganti tema"></button>
    </header>

    <div class="search-wrap">
      <div class="search-bar">
        <span class="search-bar__icon" id="homeSearchIcon"></span>
        <input id="searchInput" type="text" placeholder="Cari toilet, mushola, tenant..." autocomplete="off" inputmode="search" />
        <button class="search-bar__clear" id="btnClearSearch" style="display:none" aria-label="Bersihkan"></button>
      </div>
      <div class="search-results no-scrollbar" id="searchResults"></div>
    </div>

    <div class="section-heading">
      <div class="section-heading__title">Populer</div>
      <button class="section-heading__action" id="btnPopularSeeAll" type="button">Lihat semua <span id="popularSeeAllIcon"></span></button>
    </div>
    <div class="popular-row no-scrollbar" id="popularRow"></div>

    <div class="section-heading"><div class="section-heading__title">Akses Cepat</div></div>
    <div class="quick-actions" id="quickActions"></div>

    <div class="section-heading"><div class="section-heading__title">Pilih Lantai</div></div>
    <div class="floor-pills no-scrollbar" id="homeFloorPills"></div>
    <div class="directory-list" id="homeDirectoryList"></div>

    <div class="bottom-pad"></div>
  </section>

  <!-- ========================== MAP / PREVIEW =========================== -->
  <section id="screen-map" class="screen">
    <div class="loading-veil" id="mapLoadingVeil"><div class="spinner"></div></div>
    <div class="map-canvas-wrap" id="mapCanvas"></div>

    <div class="map-topbar">
      <button class="icon-btn" id="btnMapBack" aria-label="Kembali"></button>
      <button class="map-topbar__search glass" id="btnMapSearch" type="button">
        <span id="mapSearchIcon"></span>
        <span id="mapSearchLabel">Cari tujuan lain&hellip;</span>
      </button>
      <button class="icon-btn theme-toggle" id="btnThemeMap" aria-label="Ganti tema"></button>
    </div>

    <div class="map-floor-pills" id="mapFloorPills"></div>

    <div class="map-controls">
      <button class="fab" id="btnZoomIn" aria-label="Perbesar"></button>
      <button class="fab" id="btnZoomOut" aria-label="Perkecil"></button>
      <button class="fab" id="btnRecenterMap" aria-label="Tampilkan semua lantai"></button>
    </div>

    <div class="route-summary glass" id="routeSummary" style="display:none;"></div>

    <!-- Location preview bottom sheet -->
    <div class="sheet-scrim" id="previewScrim"></div>
    <div class="sheet" id="previewSheet">
      <div class="sheet__handle-wrap"><div class="sheet__handle"></div></div>
      <div class="sheet__scroll" id="previewSheetContent"></div>
    </div>

    <!-- Origin picker bottom sheet -->
    <div class="sheet-scrim" id="originScrim"></div>
    <div class="sheet" id="originSheet">
      <div class="sheet__handle-wrap"><div class="sheet__handle"></div></div>
      <div class="sheet__scroll" id="originSheetContent">
        <div class="section-label" style="padding:6px 0 12px;">Mulai perjalanan dari mana?</div>
        <div id="originOptionsList"></div>
      </div>
    </div>
  </section>

  <!-- ========================= FULLSCREEN NAV =========================== -->
  <section id="screen-nav" class="screen">
    <div class="map-canvas-wrap" id="navCanvas"></div>

    <div class="nav-instruction-card">
      <div class="nav-instruction-card__icon" id="navInstructionIcon"></div>
      <div class="nav-instruction-card__text">
        <div class="nav-instruction-card__main" id="navInstructionMain">Jalan lurus</div>
        <div class="nav-instruction-card__sub" id="navInstructionSub">20 meter</div>
      </div>
    </div>

    <div class="nav-fabs">
      <button class="fab" id="btnNavZoomIn" aria-label="Perbesar"></button>
      <button class="fab" id="btnNavZoomOut" aria-label="Perkecil"></button>
      <button class="fab fab-primary" id="btnNavRecenter" aria-label="Rekap posisi"></button>
    </div>

    <div class="nav-bottom-bar glass" id="navBottomBar">
      <div class="nav-bottom-bar__row">
        <div><span class="nav-bottom-bar__eta" id="navEta">–</span><span> lagi</span></div>
        <div class="nav-bottom-bar__dist" id="navDist">–</div>
        <button class="nav-bottom-bar__end" id="btnEndNav">Selesai</button>
      </div>
      <div class="nav-progress-track"><div class="nav-progress-fill" id="navProgressFill"></div></div>
    </div>

    <div class="floor-transition" id="floorTransition">
      <div class="floor-transition__badge">
        <div class="floor-transition__icon" id="floorTransitionIcon"></div>
        <div class="floor-transition__title" id="floorTransitionTitle">Naik Eskalator</div>
        <div class="floor-transition__sub" id="floorTransitionSub">Menuju lantai berikutnya</div>
      </div>
    </div>

    <div class="arrival-card" id="arrivalCard">
      <div class="arrival-card__icon" id="arrivalIcon"></div>
      <div class="arrival-card__title" id="arrivalTitle">Anda telah tiba</div>
      <div class="arrival-card__sub" id="arrivalSub">Anda telah tiba di tujuan</div>
      <button class="btn btn-primary" id="btnArrivalDone">Selesai</button>
    </div>
  </section>

</div>

<!-- ============================ BOTTOM NAV ============================ -->
<nav class="bottom-nav" id="bottomNav">
  <button class="bottom-nav__item" id="navTabHome" type="button">
    <span class="bottom-nav__icon"></span>
    <span>Home</span>
  </button>
  <button class="bottom-nav__item" id="navTabSearch" type="button">
    <span class="bottom-nav__icon"></span>
    <span>Cari</span>
  </button>
  <button class="bottom-nav__item" id="navTabMap" type="button">
    <span class="bottom-nav__icon"></span>
    <span>Map</span>
  </button>
  <button class="bottom-nav__item" id="navTabInfo" type="button">
    <span class="bottom-nav__icon"></span>
    <span>Info</span>
  </button>
</nav>

<!-- Info bottom sheet -->
<div class="sheet-scrim" id="infoScrim"></div>
<div class="sheet" id="infoSheet">
  <div class="sheet__handle-wrap"><div class="sheet__handle"></div></div>
  <div class="sheet__scroll" id="infoSheetContent"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/data-embedded.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/searchEngine.js"></script>
<script src="js/routeEngine.js"></script>
<script src="js/uiComponents.js"></script>
<script src="js/mapEngine.js"></script>
<script src="js/animationEngine.js"></script>
<script src="js/navigationEngine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
