<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- Building shell -->
  <rect x="40" y="70" width="920" height="580" rx="28" fill="var(--map-bg)" stroke="var(--map-wall)" stroke-width="3"/>

  <!-- Corridor (walkable path) -->
  <g fill="none" stroke="var(--map-corridor)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,350 L250,350 L400,350 L550,350 L700,350 L850,350 L920,350"/>
    <path d="M550,350 L550,650"/>
    <path d="M850,350 L850,300"/>
    <path d="M850,350 L850,230 L920,180"/>
  </g>
  <g fill="none" stroke="var(--map-corridor-spur)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400,350 L400,470 L400,520"/>
    <path d="M400,470 L330,470"/>
    <path d="M400,350 L400,230 L400,180"/>
    <path d="M250,350 L250,230"/>
    <path d="M250,230 L330,230"/>
    <path d="M700,350 L700,230"/>
    <path d="M700,350 L700,470"/>
    <path d="M250,350 L180,350 L180,470"/>
    <path d="M550,650 L620,650"/>
  </g>

  <!-- Room zones -->
  <g class="room-zones">
    <rect x="150" y="95" width="130" height="105" rx="14" class="room room-fashion"/>
    <text x="215" y="150" class="room-label">KIM FASHION</text>

    <rect x="290" y="95" width="120" height="105" rx="14" class="room room-fashion"/>
    <text x="350" y="150" class="room-label">MOC</text>

    <rect x="430" y="85" width="140" height="100" rx="14" class="room room-musala"/>
    <text x="500" y="140" class="room-label">MUSHOLA</text>

    <rect x="630" y="95" width="150" height="105" rx="14" class="room room-elektronik"/>
    <text x="705" y="150" class="room-label">SAMSUNG</text>

    <rect x="255" y="465" width="150" height="105" rx="14" class="room room-service"/>
    <text x="330" y="500" class="room-label">ATM</text>
    <text x="330" y="530" class="room-label">TOILET</text>

    <rect x="120" y="465" width="120" height="105" rx="14" class="room room-elektronik"/>
    <text x="180" y="520" class="room-label">ERAFONE</text>

    <rect x="630" y="465" width="150" height="105" rx="14" class="room room-travel"/>
    <text x="705" y="500" class="room-label">OMEGA</text>
    <text x="705" y="522" class="room-label">TOUR &amp; TRAVEL</text>

    <rect x="555" y="595" width="130" height="90" rx="14" class="room room-fnb"/>
    <text x="620" y="645" class="room-label">RAMEN 1</text>

    <rect x="795" y="250" width="90" height="90" rx="14" class="room room-utility"/>
    <text x="840" y="300" class="room-label">LIFT</text>
  </g>

  <!-- Entrances -->
  <g class="entrances">
    <rect x="40" y="320" width="24" height="60" rx="6" class="door"/>
    <text x="90" y="410" class="zone-label">LOBBY UTAMA</text>

    <rect x="518" y="640" width="60" height="24" rx="6" class="door"/>
    <text x="550" y="672" class="zone-label" text-anchor="middle">PINTU SELATAN</text>

    <rect x="905" y="160" width="24" height="60" rx="6" class="door"/>
    <text x="900" y="150" class="zone-label" text-anchor="end">AREA PARKIR</text>

    <text x="945" y="335" class="zone-label" text-anchor="middle">ESKALATOR</text>
  </g>

  <text x="70" y="105" class="floor-tag">GROUND FLOOR &#183; BENCOOLEN MALL</text>
</svg>
